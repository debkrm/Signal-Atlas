name: CI

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
      - 'phase-*'

jobs:
  test:
    name: Test Suite & Quality Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_secure_test_password_2026
          POSTGRES_DB: signal_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:ci_secure_test_password_2026@localhost:5432/signal_atlas_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci_secure_test_password_2026@localhost:5432/signal_atlas_test
      ALLOW_DESTRUCTIVE_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify git formatting and whitespace
        run: |
          git diff --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Alembic migrations
        run: |
          alembic upgrade head

      - name: Run Unit and Integration Tests
        run: |
          pytest -v --tb=short
