services:
  db:
    image: postgres:16-alpine
    container_name: signal_atlas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in your local .env file}
      POSTGRES_DB: ${POSTGRES_DB:-signal_atlas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - signal_atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-signal_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  signal_atlas_pgdata:
